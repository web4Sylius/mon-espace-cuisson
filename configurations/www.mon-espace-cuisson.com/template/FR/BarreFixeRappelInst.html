<div class="btn_barre_fix" id="rappelinst" onclick="donthideform(event)">

    <p id="rappelinst_error" class="msg_error">Veuillez renseigner tous les champs obligatoires</p>
    <div id="rappelinst_msg">
        <input type="text" id="rappelinst_nom" class="first" placeholder="Nom, prénom">
        <input type="text" id="rappelinst_tel" onkeypress="nbonly(event,false,this)" placeholder="Téléphone *">

        <input type="text" id="rappelinst_mail" placeholder="Email *">

</div>
