 <div class="choix_affine [?ulorigineclasse]">
        <ul class="prop [?ulorigineclasse]">
            <li class="li3 [?origine0class]" onclick="clicklichoix('origine0');show_next('origine');">
      <input type="radio" name="origine" value="[?origine0]" id="origine0" onclick="clicklichoix('origine0');show_next('origine');" [?checkorigine0] style="display: inline">
       <span style="vertical-align: baseline">Fabrication Française</span>
    </li>
    <li class="li3 [?origine1class]" onclick="clicklichoix('origine1');show_next('origine');">
      <input type="radio" name="origine" value="[?origine1]" id="origine1" onclick="clicklichoix('origine1');show_next('origine');" [?checkorigine1] style="display: inline">
       <span style="vertical-align: baseline">Fabrication Européenne</span>
    </li>
    <li class="li3 [?origine1000class]" onclick="clicklichoix('origine1000');show_next('origine');">
      <input type="radio" name="origine" value="1000" id="origine1000" onclick="clicklichoix('origine1000');show_next('origine');" [?checkorigine1000] style="display: inline">
       <span style="vertical-align: baseline">Peu importe le pays de fabrication</span>
    </li>
        <div class="clear"></div>
        </ul>
<div id="nextorigine" class="nextbtn" onclick="clickbtn(this,'origine',return_checkboxes('origine'))">Valider <i class="fas fa-chevron-right"></i></div>
