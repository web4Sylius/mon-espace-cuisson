<script language="javascript">
//Ajuste la hauteur des intitul?s de lignes dans la grilles du comparatif
     function ajusteAffichage(){
          var tbl_crit=document.getElementById('tbl_critere');
	  var tr_crit=tbl_crit.getElementsByTagName('tr');
	  var tbl_grille=document.getElementById('tbl_grille');
	  var tr_grille=tbl_grille.getElementsByTagName('tr');
	  for(i=0;i<tr_crit.length;i++){
	      var td_crit=tr_crit[i].getElementsByTagName('td')[0];
	      var td_grille=tr_grille[i].getElementsByTagName('td')[0];
	      if(td_grille.innerHTML=="") td_grille.innerHTML="&nbsp;";
	      var h=Math.max(td_crit.offsetHeight,td_grille.offsetHeight);
	      td_crit.style.height=h+"px";
	      td_grille.style.height=h+"px";
	      if(i%2==0){
		  tr_crit[i].className="gris";
		  tr_grille[i].className="gris";
	      }
	  }
	   
	  var win_height=window_size()['height'];
	  document.getElementById('bloc_bas').style.height=(win_height-350)+'px';
	  document.getElementById('TB_ajaxContent').style.height=document.getElementById('comparateur').offsetHeight+'px';
	  document.getElementById('TB_window').style.marginTop=-Math.round(win_height-document.getElementById('TB_window').offsetHeight/2-20)+'px';
      }
      
      function scrollproduits(){
	  
	  document.getElementById('table_produits').style.marginLeft=(-document.getElementById('bloc_grille').scrollLeft)+'px';
      }
     
      setTimeout(ajusteAffichage,100);
      setTimeout(ajusteAffichage,1000);
</script>
