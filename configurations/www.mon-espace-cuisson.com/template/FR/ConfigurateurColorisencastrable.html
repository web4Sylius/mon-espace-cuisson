 <div id="nextcolorisencastrable" class="nextbtn" onclick="clickbtn(this,'colorisencastrable',return_checkboxes('colorisencastrable'))">Valider <i class="fas fa-chevron-right"></i></div>
</div>
<div class="clear"></div>
