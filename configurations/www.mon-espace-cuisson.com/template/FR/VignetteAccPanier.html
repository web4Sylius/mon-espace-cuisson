<div class="vignette [?class_sup]">
	[?vfimg]
	[?vignette_indic]
	[?vignette_hover]
	<div class="clear"></div>
	
	[?img]
	<br>
	<input id="qte[?artid]" type="hidden" value="1" name="qte[?artid]">
	<div class="ajout_panier">
		<a onclick="ajaxAddProduct2('[?artid]',true,1); return false;" class="btn" href="javascript:void(0);">AJOUTER AU PANIER</a>
	</div>
	<h3><a href="[?url]">[?libelle_trunk]</a></h3>
	<span class="capacite">[?capacite]</span>
	<span class="ref"><strong>Réf. : </strong>[?marque] [?reference]</span>
	<div class="tiret"></div>
	<div class="infos_bottom">
		<div class="logo">[?logomarque]</div>
		[?pc]
		<div class="prices">
			<p class="prix_normal">[?prix_normal]</p>
			<p class="prix_remise">[?prix_remise] <sup>[?type_tva]</sup></p>
		</div>
	</div>
</div>
