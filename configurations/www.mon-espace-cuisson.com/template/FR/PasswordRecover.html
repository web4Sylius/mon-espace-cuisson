<div class="fil_ariane" xmlns:v="http://rdf.data-vocabulary.org/#">
    <span style="margin-left: 0;" typeof="v:Breadcrumb"><a href="/" rel="v:url" property="v:title">Accueil</a></span>
    &gt;
    <span style="margin-left: 0;" typeof="v:Breadcrumb">Mot de passe oublié</span>
</div>
<div class="clear"></div>

<div class="register">
    <div class="row">
      <div class="col-xs-12 col-md-offset-1 col-lg-offset-2"><h1>Récupération du mot de passe</h1></div>
    </div>
    <div class="row">
      <div class="col-xs-12 col-md-offset-1 col-md-10 col-lg-offset-2 col-lg-8">
        <form name="formu" method="post">
          <div class="passbloc col-xs-12">
            <h2>Vous avez oublié votre mot de passe ?</h2>
            <p>Saississez l'adresse e-mail de votre compte client sur notre site www.mon-espace-cuisson.com.<br>Un message vous sera envoyé immédiatement avec le mot de passe de connexion.</p>
            <input type="hidden" name="action" value="envoimail">
            <div class="error">[?raison]</div>
            <div class="fields">
              <div class="col-xs-12 col-sm-2">E-mail: </div>
              <div class="col-xs-12 col-sm-9">
                <input type="text" name="txt_mail">
              </div>
            </div>
            <div class="col-xs-12 col-sm-offset-3 col-sm-6">
              <a href="javascript:void(0)" class="button" onclick="document.forms.formu.submit();">Valider<i class="fa fa-chevron-right"></i></a>
            </div>
          </div>
        </form>
      </div>
    </div>
</div>
