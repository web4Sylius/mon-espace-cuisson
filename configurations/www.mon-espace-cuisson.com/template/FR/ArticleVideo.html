<p id="bloc_video" class="desc_titre">Vidéo</p>
<div class="clear"></div>
<!-- (1) video wrapper -->
<div class="youtube" data-embed="[?video_code]"> 
 
    <!-- (2) the "play" button -->
    <div class="play-button"></div> 
     
</div>

<script type="text/javascript">
	var youtube = document.querySelectorAll( ".youtube" );
	var source = "https://i.ytimg.com/vi/"+ youtube[0].dataset.embed +"/sddefault.jpg";
	// Load the image asynchronously
    var image = new Image();
        image.src = source;
        image.addEventListener( "load", function() {
            youtube[0].appendChild( image );
        }(0) );
    youtube[0].addEventListener( "click", function() {
 
        var iframe = document.createElement( "iframe" );
 
            iframe.setAttribute( "frameborder", "0" );
            iframe.setAttribute( "allowfullscreen", "" );
            iframe.setAttribute( "src", "https://www.youtube.com/embed/"+this.dataset.embed +"?rel=0&showinfo=0&autoplay=1" );
 
            this.innerHTML = "";
            this.appendChild( iframe );
    } );     
</script>
