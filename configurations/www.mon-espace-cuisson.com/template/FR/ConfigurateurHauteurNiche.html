<div class="question col-xs-12" onclick="show_question('hauteurniche')">
  <div class="col-xs-12">
    <div class="col-sm-8 col-xs-11">
      <h2>Pour quelle hauteur de la niche ?</h2>
      <div class="reponse" id="rephauteurniche"></div>
    </div>
    <div class="col-lg-4 hidden-xs">
      <div class="close" id="btnhauteurniche" data-close="Masquer les critères" data-open="Voir les critères<i class='fa fa-caret-down'></i>">

      </div>
    </div>
    <div class="col-xs-1 visible-xs close" id="btnresphauteurniche" data-close="<i class='fa fa-caret-up'></i>" data-open="<i class='fa fa-caret-down'></i>">
      <div class="txt" onselectstart='return false;'><i class='fa fa-caret-down'></i></div>
    </div>
  </div>
</div>
